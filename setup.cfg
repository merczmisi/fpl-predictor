[metadata]
name = fpl
version = 0.0.0
description = FPL draft helper
author = mihalymercz

[options]
py_modules = fpl_session
packages = find:
install_requires =
    requests
    pandas
    playwright
    fastapi
    uvicorn

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    fpl-draft = webapi.launcher:main
